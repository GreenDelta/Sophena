#Mon Sep 28 17:16:25 CEST 2026
AnnualCOP=Zur Ermittlung kann z.B. der Jahresarbeitszahlrechner des Bundesverbands W\u00E4rmepumpe (https\://www.waermepumpe.de/jazrechner/) verwendet werden.
AvgPowerDemandInfo=Strom, der f\u00FCr den Betrieb der Biogasanlage ben\u00F6tigt wird (z.B. f\u00FCr R\u00FChrwerke und Pumpen). Das ist der auf die Stunde gemittelte Wert.
BoilerAccessories=Sofern bei Biomassekesseln keine Kosten f\u00FCr Kesselzubeh\u00F6r (Austragung, Entaschung, Regeltechnik und Einbau) enthalten sind, k\u00F6nnen diese in Summe mit 60-90% der Kosten f\u00FCr den Kessel mit Feuerung grob \u00FCberschlagsm\u00E4\u00DFig abgesch\u00E4tzt werden. Bei fossilen Kesseln sind ggf. Kosten f\u00FCr Einbau (ca. 2.500 \u20AC - 5.000 \u20AC) und Tanks (20-30 % der Kosten f\u00FCr den Kessel) zu ber\u00FCcksichtigen.
BoilerHouseTechnology=Diese Kategorie beinhaltet Hydraulik- und Elektroinstallation (ca. 10-15 % der Kosten f\u00FCr W\u00E4rmeerzeuger mit Zubeh\u00F6r, Geb\u00E4ude und W\u00E4rmenetz) sowie \u00FCbergeordnete Mess- und Regeltechnik (15-20 % der Kosten f\u00FCr die Technik ohne Biomassekessel).
BufferLambda=Bei der Berechnung wird vereinfachend davon ausgegangen, dass es sich um einen zylindrischen Speicher mit homogener D\u00E4mmung in der angegebenen St\u00E4rke handelt.
Buildings=Bei einem Neubau k\u00F6nnen f\u00FCr das Heizhaus in etwa 100-200 \u20AC/kW angesetzt werden. Bei Umbauten ist eine individuelle Absch\u00E4tzung unerl\u00E4sslich.
CoGenPlants=Hinweis\: Die elektrische Leistung eines BHKW ist abh\u00E4ngig vom Aufstellungsort.
CollectorAlignment=Die Ausrichtung muss in Grad eingegeben werden. Dabei sind bei 0\u00B0 die Kollektoren nach S\u00FCden ausgerichtet, bei - 90\u00B0 nach Osten, bei 90\u00B0 nach Westen und bei 180\u00B0 nach Norden.
CollectorArea=Hier wird die Bruttokollektorfl\u00E4che eingegeben. Bei einer Freifl\u00E4chenanlage k\u00F6nnen pro m2 Grundfl\u00E4che ca. 0,5 m2 Bruttokollektorfl\u00E4che angenommen werden.
CollectorTemperatureDifference=Die im W\u00E4rmenetz ben\u00F6tigte Temperatur ist um den angegebenen Wert h\u00F6her als die R\u00FCcklauftemperatur (nur bei Vorw\u00E4rmbetrieb relevant).
CollectorTemperatureIncrease=Erst wenn die Temperatur der Solarthermieanlage um den angegebenen Wert h\u00F6her als die im W\u00E4rmenetz ben\u00F6tigte Temperatur ist, liefert die Anlage W\u00E4rme.
CollectorTilt=Bei Dachanlagen wird die Dachneigung eingegeben, bei Freifl\u00E4chenanlagen die Summe aus Hangneigung und Kollektorneigung. Dabei entspricht 0\u00B0 einem waagrecht liegenden Kollektor.
DemandElectricityMixInfo=Bezogen auf den zugekauften Strom.
ElectricityDemandShare=Der Prozentsatz bezieht sich auf die im Heizhaus erzeugte W\u00E4rmemenge.
ElectricityPriceInfo=Preis f\u00FCr zugekauften Strom bei Volleinspeisung oder wenn das BHKW still steht. Wird in Stillstandszeiten zum Teil eigener PV-Strom verwendet, kann hier ein Mischpreis aus PV-Strom und Netzstrom eingegeben werden.
ElectricityRevenues=Bei der Berechnung der mittleren Stromerl\u00F6se m\u00FCssen u.a. auch Differenzen zwischen Verg\u00FCtungszeitraum und Projektlaufzeit sowie ggf. der Mehrwert von eigenverbrauchtem Strom ber\u00FCcksichtigt werden.
FeedInModeInfo=Bei Volleinspeisung wird f\u00FCr den Eigenstrombedarf immer der oben angegebene Strompreis verwendet. Bei \u00DCberschusseinspeisung wird bei laufendem BHKW der Eigenstrombedarf von der installierten Leistung abgezogen und nicht eingespeist, in den \u00FCbrigen Zeiten wird der oben genannte Strompreis verwendet.
HeatingLoad=Die Heizlast umfasst Geb\u00E4udebeheizung einschlie\u00DFlich Warmwasserbereitung.
HeatingNetConstruction=Kosten f\u00FCr Rohr- und Tiefbau eines W\u00E4rmenetzes h\u00E4ngen im Wesentlichen davon ab, ob flexible oder starre Leitungen verlegt werden, wie Oberfl\u00E4che und Untergrund beschaffen sind und welchen Durchmesser die Leitungen haben. Die Spanne reicht hier in etwa von 100 \u20AC/m f\u00FCr flexible Rohrleitungen mit 25 mm Durchmesser auf unbefestigtem Gel\u00E4nde bis 500 \u20AC/m f\u00FCr starre Leitungen mit 150 mm Durchmesser auf asphaltiertem Gel\u00E4nde.
HeatingNetTechnology=Bei Netzpumpen verringern sich die Kosten pro kW maximale Netzlast f\u00FCr h\u00F6here Leistungsbereiche sehr stark. W\u00E4hrend im kleineren Leistungsbereich z.B. bei 50-100 kW etwa 55-40 \u20AC/kW anfallen, sind z.B. bei 1.000-5.000 kW etwa 10-5 \u20AC/kW ansetzbar. Die angegebenen Spannen beziehen sich auf Erfahrungswerte f\u00FCr ein W\u00E4rmenetz mit einem Heizkreis.
InterpolationInfo=In den sich ergebenden Zwischenzeiten werden die Werte durch lineare Interpolation ermittelt.
LatitudeInfo=Angabe in Grad, ggf. mit Vorzeichen (+ entspricht Nord, - entspricht S\u00FCd)
LengthPowerLoss=Die Trassenl\u00E4nge und Verlustleistung werden automatisch aus den hinzugef\u00FCgten W\u00E4rmeleitungen berechnet.
LimitRadiationInfo=Nur relevant f\u00FCr die Betriebsart "automatisch (Einstrahlung)". Ab dieser Einstrahlung l\u00E4uft die Anlage im Zieltemperaturbetrieb.
LongitudeInfo=Angabe in Grad, ggf. mit Vorzeichen (+ entspricht Ost, - entspricht West)
ManureBiomethanePriceInfo=Die Verstromung des Biogas mit W\u00E4rmenutzung wird mit einer Aufbereitung zu Biomethan verglichen. Dieser Preis wird f\u00FCr Biomethan, das aus Substraten mit CO2-Emissionen <-60g/MJ gewonnen wurde, verwendet.
MaxPerfInfo=Maximale W\u00E4rmemenge, die in einer Stunde abgegeben werden kann. Relevant v.a. bei saisonalen W\u00E4rmespeichern.
NonManureBiomethanePriceInfo=Die Verstromung des Biogas mit W\u00E4rmenutzung wird mit einer Aufbereitung zu Biomethan verglichen. Dieser Preis wird f\u00FCr Biomethan, das aus Substraten mit CO2-Emissionen >=-60g/MJ gewonnen wurde, verwendet.
OperatingData=Die Berechnungen sind umso genauer, je mehr Betriebspunkte bekannt sind. F\u00FCr jede Zieltemperatur m\u00FCssen mindestens 2 Betriebspunkte erfasst werden.Zieltemperaturen k\u00F6nnen nur auf 5\u00B0C genau erfasst werden.
OperatingModeInfo=Automatisch (Einstrahlung)\: Die Entscheidung erfolgt stundenweise datengetrieben (Zieltemperaturbetrieb ab einer Einstrahlung pro m2 > 0,4 kW). <br>Automatisch (Jahreszeit)\: Im Sommer erfolgt Zieltemperaturbetrieb, im Rest des Jahres Vorw\u00E4rmbetrieb. Dabei wird der beim Pufferspeicher erfasste Sommerzeitraum verwendet. <br>Vorw\u00E4rmbetrieb\: Es erfolgt ganzj\u00E4hrig Vorw\u00E4rmbetrieb. <br>Zieltemperaturbetrieb\: Es erfolgt ganzj\u00E4hrig Zieltemperaturbetrieb.
Planning=In Summe betragen die Planungskosten erfahrungsgem\u00E4\u00DF ca. 8-12 % der gesamten Investitionskosten.
PlantDurationInfo=Die (Rest-)Laufzeit der Biogasanlage kann sich von der Laufzeit des W\u00E4rmenetzes unterscheiden.
PowerLoss=Der absolute Netzverlust berechnet sich in jeder Stunde als Produkt der Verlustleistung in W/K und der Temperaturdifferenz zwischen W\u00E4rmeleitung und Boden in dieser Stunde. <br>Als W\u00E4rmeleitungstemperatur wird der Mittelwert zwischen Vorlauf- und R\u00FCcklauftemperatur angesetzt, die Bodentemperatur wird generell mit 10 \u00B0C angenommen.
PrimaryEnergyFactor=Bei dem angegebenen Wert handelt es sich um eine Sch\u00E4tzung, die auf Grundlage der AGFW-Richtlinie erstellt wurde. Eine verbindliche Berechnung des Prim\u00E4renergiefaktors kann nur durch einen anerkannten Sachverst\u00E4ndigen durchgef\u00FChrt werden.
ReferenceLongitudeInfo=Zentraler L\u00E4ngengrad der Zeitzone der Wetterstation, stets ein Vielfaches von 15\u00B0, Angabe ggf. mit Vorzeichen (+ entspricht Ost, - entspricht West)
SimultaneityFactor=Der Gleichzeitigkeitsfaktor ist der Quotient aus der tats\u00E4chlich im Netz ben\u00F6tigten Maximalleistung und der Summe der Nennleistungen der Abnehmer und beeinflusst somit die im Heizhaus zu installierende Leistung. Gleichzeitigkeitsfaktoren bewegen sich normalerweise im Bereich zwischen 0,5 und 1. Je mehr Abnehmer ein W\u00E4rmenetz versorgt und je unterschiedlicher diese sind, umso h\u00F6her ist der Effekt und umso geringer ist der Gleichzeitigkeitsfaktor.
SmoothingFactor=Die Eingabe eines Gleichzeitigkeitsfaktors (< 1) initiiert eine Gl\u00E4ttung der Jahresdauerlinie. Durch den Gl\u00E4ttungsfaktor kann die St\u00E4rke der Gl\u00E4ttung beeinflusst werden. Die Voreinstellung gl\u00E4ttet die Jahresdauerlinie so, dass die Leistungsspitzen etwas unterhalb der maximal ben\u00F6tigten Leistung (mit Ber\u00FCcksichtigung des Gleichzeitigkeitsfaktor) liegen. Bei einem Gl\u00E4ttungsfaktor von 0 bleibt die Jahresdauerlinie unabh\u00E4ngig vom Gleichzeitigkeitsfaktor unver\u00E4ndert. Die Gl\u00E4ttung hat keine Auswirkung auf die Berechnung der zu installierenden Leistung oder auf die insgesamt bereitzustellende W\u00E4rmemenge.
TargetChargeLevel=Gibt den Puffer-Ladestand vor, der mit dem W\u00E4rmeerzeuger erreicht werden soll. Nur bei Einstellung "bis Ziel-Ladestand laden" relevant.  <br>Ein Ladestand von 0 % bedeutet, dass sich der Pufferspeicher auf R\u00FCcklauftemperaturniveau befindet.  <br>Ein Ladestand von 100 % bedeutet, dass der Pufferspeicher auf maximale Ladetemperatur aufgeheizt ist.
UseHeatingCurve=Bei Aktivierung sind Vorlauf- und R\u00FCcklauftemperatur sowie Ziel-Ladestand au\u00DFentemperaturabh\u00E4ngig. Die bei Winter und Sommer eingegebenen Werte werden folgenderma\u00DFen interpretiert\: <br>- Winter\: Vorlauftemperatur, R\u00FCcklauftemperatur und Ziel-Ladestand in der k\u00E4ltesten Stunde des Jahres <br>- Sommer\: Vorlauftemperatur, R\u00FCcklauftemperatur und Ziel-Ladestand bei und \u00FCber Heizgrenztemperatur <br>Bei allen dazwischenliegenden Au\u00DFentemperaturen werden die Werte \u00FCber eine lineare Interpolation ermittelt und auf 5 \u00B0C bzw. 5 % genau gerundet.
UtilisationRate=Es muss der thermische Nutzungsgrad der KWK-Anlage eingegeben werden.
UtilisationRateSolarInfo=Hier k\u00F6nnen pauschale Verluste durch Verrohrung, Verschattung o.\u00C4. ber\u00FCcksichtigt werden.
